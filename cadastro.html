<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Conecta Saúde</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>

  <!-- CABEÇALHO (Wireframe 1) -->
  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo" aria-label="Voltar para a página inicial">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 88C50 88 12 62 12 36C12 22.7 22.7 12 36 12C43.5 12 50 16 50 16C50 16 56.5 12 64 12C77.3 12 88 22.7 88 36C88 62 50 88 50 88Z" stroke="#e66700" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 46H36L43 30L55 62L64 42L70 46H78" stroke="#e66700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div>
        <a href="login.html" class="btn btn-outline-white btn-sm">Já tenho conta</a>
      </div>
    </div>
  </header>

  <!-- CONTAINER DE CADASTRO -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 88C50 88 12 62 12 36C12 22.7 22.7 12 36 12C43.5 12 50 16 50 16C50 16 56.5 12 64 12C77.3 12 88 22.7 88 36C88 62 50 88 50 88Z" stroke="#e66700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 46H36L43 30L55 62L64 42L70 46H78" stroke="#e66700" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Conecta<br>Saúde</h1>
      </div>

      <div id="cadastroAlert" class="alert-message"></div>

      <form id="cadastroForm">
        <div class="form-group">
          <input type="text" id="nome" class="form-input" placeholder="Nome Completo" required autocomplete="name">
        </div>

        <div class="form-group">
          <input type="email" id="email" class="form-input" placeholder="Email" required autocomplete="email">
        </div>

        <div class="form-group">
          <input type="text" id="cpf" class="form-input" placeholder="CPF (000.000.000-00)" maxlength="14" required>
        </div>

        <div class="form-group">
          <input type="password" id="senha" class="form-input" placeholder="Senha (mínimo 6 caracteres)" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <input type="password" id="confirmSenha" class="form-input" placeholder="Confirmar senha" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <select id="tipo" class="form-select" required>
            <option value="" disabled selected>Tipo da conta</option>
            <option value="paciente">Paciente</option>
            <option value="profissional">Profissional de Saúde (Médico)</option>
          </select>
        </div>

        <!-- Campos adicionais dinâmicos para Profissional de Saúde -->
        <div id="professionalFields" style="display: none; background: var(--primary-teal-bg); padding: 1rem; border-radius: 8px; margin-bottom: 1.2rem; border: 1.5px solid var(--primary-teal-light);">
          <div class="form-group">
            <label for="especialidade" style="font-size: 0.85rem; color: var(--primary-teal-dark);">Especialidade Médica:</label>
            <select id="especialidade" class="form-select">
              <option value="" disabled selected>Selecione a especialidade</option>
              <option value="Cardiologista">Cardiologista</option>
              <option value="Ortopedista">Ortopedista</option>
              <option value="Pediatra">Pediatra</option>
              <option value="Oftalmologista">Oftalmologista</option>
              <option value="Ginecologista">Ginecologista</option>
              <option value="Urologista">Urologista</option>
              <option value="Nutricionista">Nutricionista</option>
              <option value="Geriatra">Geriatra</option>
              <option value="Clínico Geral">Clínico Geral</option>
              <option value="Dermatologista">Dermatologista</option>
              <option value="Neurologista">Neurologista</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="crm" style="font-size: 0.85rem; color: var(--primary-teal-dark);">Número de Registro Profissional (CRM):</label>
            <input type="text" id="crm" class="form-input" placeholder="Ex: CRM/SP 123456">
          </div>
        </div>

        <div style="text-align: left; margin-top: 1.2rem;">
          <button type="submit" class="btn btn-orange" style="padding: 0.75rem 2.5rem; width: 100%;">Avançar</button>
        </div>
      </form>

      <div class="auth-links" style="margin-top: 1.5rem; justify-content: center;">
        <span>Já possui uma conta? <a href="login.html" class="auth-link" style="color: var(--primary-teal); font-weight: 700;">Faça Login</a></span>
      </div>

      <div class="auth-security-note">
        <strong>Aviso demonstrativo:</strong> Aplicação front-end com armazenamento local (localStorage). Não utilize dados sensíveis reais.
      </div>
    </div>
  </main>

  <footer class="main-footer">
    Conecta Saude © 2026
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/autenticacao.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
